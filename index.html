<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aftab Movies Hub</title>
<style>
    * {margin:0; padding:0; box-sizing:border-box;}
  body {background:#141414; color:white; font-family:Arial, sans-serif;}
  
  /* HEADER */
  header {
    background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 100%);
    padding:15px 4%; display:flex; align-items:center; justify-content:space-between;
    position:fixed; width:100%; top:0; z-index:10;
  }
  header h1 {color:red; font-size:28px; font-weight:bold;}
  nav a {color:#e5e5e5; text-decoration:none; margin:0 15px; font-size:14px;}
  nav a:hover {color:#fff;}
  
  /* BANNER */
  .banner {
    height:80vh; 
    background: linear-gradient(to right, rgba(0,0,0,0.8) 0%, transparent 60%), url('https://picsum.photos/1920/1080?blur=2');
    background-size:cover; background-position:center;
    display:flex; flex-direction:column; justify-content:center;
    padding:0 4%; margin-top:60px;
  }
  .banner h2 {font-size:3vw; max-width:40%; margin-bottom:15px;}
  .banner p {font-size:1.2vw; max-width:40%; color:#ccc; margin-bottom:20px;}
  .banner button {
    padding:10px 25px; margin-right:10px; font-size:16px; font-weight:bold;
    border:none; border-radius:4px; cursor:pointer;
  }
  .btn-play {background:#fff; color:#000;}
  .btn-info {background:rgba(109,109,110,0.7); color:#fff;}
  
  /* ROWS */
  .row {padding:20px 4%;}
  .row h3 {font-size:1.4vw; margin-bottom:15px;}
  .movies {display:flex; gap:8px; overflow-x:auto; overflow-y:hidden;}
  .movies::-webkit-scrollbar {display:none;}
  
  .movie-card img {
    height:220px; width:150px; border-radius:4px; cursor:pointer;
    transition: transform 0.3s;
  }
  .movie-card img:hover {transform:scale(1.08);}
  
  footer {text-align:center; padding:30px; color:#808080; font-size:13px;}
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div style="display:flex; align-items:center;">
    <h1>AFTAB</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#">Movies</a>
      <a href="#">Series</a>
      <a href="#">My List</a>
    </nav>
  </div>
</header>

<!-- BANNER -->
<div class="banner">
  <h2>Featured Movie</h2>
  <p>Ye featured movie ki description hai. Yahan apni movie ki story likhna.</p>
  <div>
    <button class="btn-play">▶ Play</button>
    <button class="btn-info">ℹ More Info</button>
  </div>
</div>

<!-- ROW 1 -->
<div class="row">
  <h3>Trending Now</h3>
  <div class="movies">
    <div class="movie-card"><img src="https://picsum.photos/150/220?random=1"></div>

</div>

<footer>
  <p>© 2026 Aftab Movies Hub</p>

</body>
</html>
