<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aftab Movies Hub</title>
<style>
    * {margin:0; padding:0; box-sizing:border-box;}
  body {background:#141414; color:white; font-family:Arial, sans-serif;}
  
  /* 1. HEADER */
  header {
    background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 100%);
    padding:15px 4%; display:flex; align-items:center; justify-content:space-between;
    position:fixed; width:100%; top:0; z-index:10;
  }
  header h1 {color:red; font-size:28px; font-weight:bold;}
  nav a {color:#e5e5e5; text-decoration:none; margin:0 15px; font-size:14px;}
  nav a:hover {color:#fff;}
  .right {display:flex; gap:20px; align-items:center;}
  
  /* 2. HERO BANNER */
  .banner {
    height:80vh; background:#000;
    display:flex; flex-direction:column; justify-content:center;
    padding:0 4%; margin-top:60px;
    border-bottom:1px dashed #333;
  }
  .banner h2 {font-size:3vw; max-width:40%; margin-bottom:15px;}
  .banner p {font-size:1.2vw; max-width:40%; color:#ccc; margin-bottom:20px;}
  .banner button {
    padding:10px 25px; margin-right:10px; font-size:16px; font-weight:bold;
    border:none; border-radius:4px; cursor:pointer;
  }
  .btn-play {background:#fff; color:#000;}
  .btn-info {background:rgba(109,109,110,0.7); color:#fff;}
  
  /* 3. MOVIE ROWS */
  .row {padding:20px 4%;}
  .row h3 {font-size:1.4vw; margin-bottom:15px;}
  .movies {
    display:flex; gap:8px; overflow-x:auto; overflow-y:hidden; 
    min-height:220px; border:1px dashed #444; border-radius:4px; padding:10px 0;
  }
  .movies::-webkit-scrollbar {display:none;}
  
  /* 4. FOOTER */
  footer {text-align:center; padding:30px; color:#808080; font-size:13px;}
</style>
</head>
<body>
